[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "gulliver-mcp"
version = "0.2.0"
description = "Test on tiny data before you run on giant data. A dress rehearsal for data agents: estimate the cost, rehearse on 1% -> 10%, predict 100%, and only go full scale within budget."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "laaielichter" }]
keywords = ["mcp", "ai-agents", "data-engineering", "sql", "duckdb", "bigquery", "snowflake", "postgres", "cost", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "sqlglot>=25.0",
  "duckdb>=1.1",
  "mcp>=1.10",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
bigquery = ["google-cloud-bigquery>=3.20"]
snowflake = ["snowflake-connector-python>=3.10"]
all = [
  "psycopg[binary]>=3.1",
  "google-cloud-bigquery>=3.20",
  "snowflake-connector-python>=3.10",
]
dev = ["pytest>=8"]

[project.scripts]
gulliver = "gulliver.cli:main"
gulliver-mcp = "gulliver.mcp_server:main"

[project.urls]
Homepage = "https://laaielichter.github.io/Gulliver/"
Source = "https://github.com/laaielichter/Gulliver"
Issues = "https://github.com/laaielichter/gulliver/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gulliver"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "skills", "README.md", "AGENTS.md", "llms.txt", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM", "S"]
ignore = [
  "S608",   # SQL built from parts: Gulliver generates SQL on purpose; every query is parsed and gated
  "S101",   # assert in tests
  "SIM108", # ternaries are not always clearer
  "B904",
  "SIM105", # explicit try/except/pass reads better in cleanup code
  "S110",   # silent cleanup in close()/interrupt is intended
  "B027",   # optional hooks on the engine base class
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
